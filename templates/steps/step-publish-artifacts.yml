# Step Template: Publish Build & Checker Artifacts to Pipeline Drop
parameters:
  - name: artifactName
    type: string
    default: 'drop'
  - name: exportStagingDir
    type: string
  - name: checkerReportsDir
    type: string
    default: '$(Build.ArtifactStagingDirectory)/checker'

steps:
  - task: CopyFiles@2
    displayName: 'Stage Solution ZIPs for Artifact Drop'
    inputs:
      SourceFolder: '${{ parameters.exportStagingDir }}'
      Contents: '*.zip'
      TargetFolder: '$(Build.ArtifactStagingDirectory)/drop/solutions'

  - task: CopyFiles@2
    displayName: 'Stage Solution Checker Reports for Artifact Drop'
    inputs:
      SourceFolder: '${{ parameters.checkerReportsDir }}'
      Contents: '**'
      TargetFolder: '$(Build.ArtifactStagingDirectory)/drop/checker'
    condition: always()

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifacts ($( ${{ parameters.artifactName }} ))'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/drop'
      ArtifactName: '${{ parameters.artifactName }}'
      publishLocation: 'Container'
